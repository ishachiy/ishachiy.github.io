<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101020;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #191933;
        }

        h1 {
            color: #a78bfa;
        }

        main {
            padding: 60px 20px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }
    </style>
</head>

<body>
    <header>
        <h1>Мой первый сайт</h1>
        <p>Добро пожаловать!</p>
    </header>

    <main>
        <h2>Привет, интернет!</h2>
        <p>Это мой собственный сайт, созданный с нуля.</p>

        <button onclick="alert('Ты нажал на кнопку!')">
            Нажми меня
        </button>
    </main>
</body>
</html>
